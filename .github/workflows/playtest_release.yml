# Copied to the play-test repository by publish_playtest.ps1. The Build workflow
# remains read-only; this separate workflow receives write access only after
# all four build jobs succeed on this repository's main branch.
name: Publish playtest prerelease
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: [.github/workflows/playtest_release.yml]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build run ID to republish (blank selects the latest successful main Build)
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    if: >-
      ${{ (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'main' &&
           (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) ||
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
           github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: playtest-prerelease-publisher
      cancel-in-progress: false
    env:
      SOURCE_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve and validate successful Build
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            run_id="$TRIGGER_RUN_ID"
          elif [[ "$EVENT_NAME" == workflow_dispatch && -n "$INPUT_RUN_ID" ]]; then
            run_id="$INPUT_RUN_ID"
          else
            listing=$(gh api "repos/$SOURCE_REPO/actions/workflows/build.yml/runs?branch=main&status=success&per_page=20")
            selected=$(jq -c --arg repo "$SOURCE_REPO" '
              [.workflow_runs[] | select(
                .conclusion == "success" and .head_branch == "main" and
                .head_repository.full_name == $repo and
                (.event == "push" or .event == "workflow_dispatch") and
                (.path == ".github/workflows/build.yml" or
                 (.path | startswith(".github/workflows/build.yml@")))
              )] | sort_by(.run_number) | last // null' <<< "$listing")
            if [[ "$selected" == null ]]; then
              echo "No qualifying successful main Build found; skipping release"
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            run_id=$(jq -r '.id' <<< "$selected")
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$SOURCE_REPO/actions/runs/$run_id")
          jq -e --arg repo "$SOURCE_REPO" '
            .conclusion == "success" and .head_branch == "main" and
            .head_repository.full_name == $repo and
            (.event == "push" or .event == "workflow_dispatch") and
            (.path == ".github/workflows/build.yml" or
             (.path | startswith(".github/workflows/build.yml@")))' <<< "$run" > /dev/null
          sha=$(jq -r '.head_sha' <<< "$run")
          number=$(jq -r '.run_number' <<< "$run")
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$number" =~ ^[0-9]+$ ]]
          printf 'ready=true\nsha=%s\nrun_id=%s\nnumber=%s\n' "$sha" "$run_id" "$number" >> "$GITHUB_OUTPUT"
      # Exact names and run ID bind every payload to the successful Build.
      # Do not check out or execute anything from a downloaded artifact.
      - name: Download Windows package
        if: steps.resolve.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: OmegaStrain-windows-${{ steps.resolve.outputs.sha }}
          path: ${{ runner.temp }}/playtest-artifacts/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve.outputs.run_id }}
      - name: Download Vita GXM package
        if: steps.resolve.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: omega_vita_gxm-${{ steps.resolve.outputs.sha }}
          path: ${{ runner.temp }}/playtest-artifacts/vita-gxm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve.outputs.run_id }}
      - name: Download PS5 folder title
        if: steps.resolve.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: omega_ps5-PPSA99720-${{ steps.resolve.outputs.sha }}
          path: ${{ runner.temp }}/playtest-artifacts/ps5
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve.outputs.run_id }}
      - name: Package exactly three release files
        if: steps.resolve.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACTS="$RUNNER_TEMP/playtest-artifacts"
          RELEASE_DIR="$RUNNER_TEMP/playtest-release"
          test -s "$ARTIFACTS/windows/OmegaStrain.exe"
          test -s "$ARTIFACTS/vita-gxm/omega_vita.vpk"
          test -s "$ARTIFACTS/ps5/eboot.bin"
          test -s "$ARTIFACTS/ps5/sce_module/libc.prx"
          mkdir -p "$RELEASE_DIR/OmegaStrain" "$RELEASE_DIR/PPSA99720"
          cp -a "$ARTIFACTS/windows/." "$RELEASE_DIR/OmegaStrain/"
          cp -a "$ARTIFACTS/ps5/." "$RELEASE_DIR/PPSA99720/"
          cp "$ARTIFACTS/vita-gxm/omega_vita.vpk" "$RELEASE_DIR/OmegaStrain-vita-GXM.vpk"
          (cd "$RELEASE_DIR" && zip -q -r OmegaStrain-windows.zip OmegaStrain)
          (cd "$RELEASE_DIR" && zip -q -r OmegaStrain-ps5-PPSA99720.zip PPSA99720)
          test -s "$RELEASE_DIR/OmegaStrain-windows.zip"
          test -s "$RELEASE_DIR/OmegaStrain-vita-GXM.vpk"
          test -s "$RELEASE_DIR/OmegaStrain-ps5-PPSA99720.zip"
      - name: Create, upload, then publish prerelease
        if: steps.resolve.outputs.ready == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.resolve.outputs.sha }}
          SOURCE_RUN: ${{ steps.resolve.outputs.run_id }}
          SOURCE_NUMBER: ${{ steps.resolve.outputs.number }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/playtest-release"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          short="${SOURCE_SHA:0:8}"
          tag="playtest-${SOURCE_NUMBER}-${short}"
          if ref=$(gh api "repos/$SOURCE_REPO/git/ref/tags/$tag" --jq '.object.sha' \
                    2>"$RELEASE_DIR/tag-lookup-error"); then
            :
          elif grep -q 'HTTP 404' "$RELEASE_DIR/tag-lookup-error"; then
            ref=''
          else
            cat "$RELEASE_DIR/tag-lookup-error" >&2
            exit 1
          fi
          if [[ -n "$ref" && "$ref" != "$SOURCE_SHA" ]]; then
            echo "Tag $tag points to a different source commit" >&2
            exit 1
          fi
          # The by-tag release endpoint omits drafts. List authenticated
          # releases so a failed upload can resume its existing draft.
          echo "Checking for an existing release: $tag"
          releases=$(gh api --paginate "repos/$SOURCE_REPO/releases?per_page=100")
          release=$(jq -c --arg tag "$tag" '.[] | select(.tag_name == $tag)' <<< "$releases")
          if [[ -n "$release" ]]; then
            target=$(jq -r '.target_commitish' <<< "$release")
            draft=$(jq -r '.draft' <<< "$release")
            [[ "$ref" == "$SOURCE_SHA" || "$target" == "$SOURCE_SHA" ]] || { echo "Release $tag targets another commit" >&2; exit 1; }
            if [[ "$draft" == false ]]; then
              echo "Published release $tag already exists; leaving it untouched"
              exit 0
            fi
          else
            cat > "$RELEASE_DIR/notes.md" <<EOF
          Playtest build from source commit [\`$SOURCE_SHA\`](https://github.com/$SOURCE_REPO/commit/$SOURCE_SHA), after successful [Build #$SOURCE_NUMBER](https://github.com/$SOURCE_REPO/actions/runs/$SOURCE_RUN).

          You need your own 1:1 image of the USA disc (SCUS-97264). No game data or extracted game assets are included.

          Downloads: Windows folder zip, PS Vita GXM VPK (SFOS00004), and PS5 folder title zip (PPSA99720). The Vita vitaGL build is checked by CI but is not published in this prerelease.
          EOF
            # An existing tag already fixes the source commit. Do not request
            # tag creation at an older workflow revision a second time.
            target_args=(--target "$SOURCE_SHA")
            if [[ "$ref" == "$SOURCE_SHA" ]]; then
              target_args=(--verify-tag)
            fi
            echo "Creating draft release: $tag"
            gh release create "$tag" --repo "$SOURCE_REPO" "${target_args[@]}" \
              --title "Playtest #$SOURCE_NUMBER ($short)" --notes-file "$RELEASE_DIR/notes.md" \
              --draft --prerelease --latest=false
          fi
          # A failed upload leaves only a draft. Reruns may repair that draft;
          # a published release is never overwritten.
          echo "Uploading the three packages: $tag"
          gh release upload "$tag" --repo "$SOURCE_REPO" --clobber \
            "$RELEASE_DIR/OmegaStrain-windows.zip" \
            "$RELEASE_DIR/OmegaStrain-vita-GXM.vpk" \
            "$RELEASE_DIR/OmegaStrain-ps5-PPSA99720.zip"
          echo "Publishing prerelease: $tag"
          gh release edit "$tag" --repo "$SOURCE_REPO" --draft=false --prerelease --latest=false
