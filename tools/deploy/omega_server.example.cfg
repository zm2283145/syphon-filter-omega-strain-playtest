# omega_server example configuration (port-only, 132on2g; research/ONLINE_DEPLOY.md section 4).
# Copy it into the server's data folder as omega_server.cfg and edit it. Every key is optional; the values are the
# defaults unless marked "example". Comments must be on their own lines (a # after a value is part of the value).
# No secrets here: put your own long random admin_token in your copy (never commit it), or leave it empty and use
# admin accounts.

# --- identity ---
server_name=omega_server
# example: the address the players reach (default 127.0.0.1)
public_ip=203.0.113.10
# example: every interface (default 127.0.0.1, this machine only)
bind=0.0.0.0
port=10075
# players per game, 2..4
max_players=4
# 1 (the current development default) lets each player's own cheats work online, for that player only
allow_cheats=1
# any | cosmetic | none
mod_policy=any
# empty (the default) disables token admin
admin_token=

# --- files (relative to the working directory, which --data-dir sets) ---
accounts=omega_accounts.txt
stats_file=omega_stats.txt
policy_file=omega_policy.txt
social_file=omega_social.txt
log=omega_server.log
# text or json (one JSON object per line)
log_format=text
# the log rotates at this size in bytes (0: never), keeping log_keep older files (omega_server.log.1 ..)
log_max_bytes=10485760
log_keep=5
# finished games kept
max_results=200
backups=5
# seconds, or 30m / 2h / 1d
backup_interval=1h

# --- security and limits (0 turns a limit off) ---
pbkdf2_iterations=120000
# threads computing the password digests off the server loop (0: half the CPUs, 1..4)
password_threads=0
max_conns_per_ip=16
# frames per second per connection, and the burst
message_rate=100
message_burst=1000
# failed logins per name and address (4x that per address) within the window lock it for the lockout
login_failures=5
login_window=10m
login_lockout=5m
# new accounts per address per hour
registrations_per_hour=20

# --- anti-abuse (rate limits per address and per account; 0 turns one off) ---
# login and account-creation attempts per address per minute; login attempts per account name per minute
login_attempts_per_ip=30
login_attempts_per_account=10
# lobby chat lines per player per minute and their burst, and per address per minute
chat_per_minute=30
chat_burst=10
chat_per_minute_ip=120
# dropped chat lines within a minute that disconnect the player
chat_flood_kick=5
# flood disconnects (message_rate, chat_flood_kick) from one address within flood_window block it for flood_block
flood_block_after=3
flood_window=10m
flood_block=15m

# --- lobby chat (the profanity filter; each port player may choose their own setting) ---
# 1 (the default) masks the listed words for every player who has not chosen; 0 shows chat as typed
chat_filter=1
# example (empty: the built-in list): a file of words, one per line; a first line "+" keeps the built-in list too
#chat_filter_words=omega_chat_words.txt

# --- the in-level relay (0 = off) ---
# example (default 0)
relay_port=10076
relay_max_endpoints=64
relay_packet_rate=200
relay_byte_rate=262144
relay_idle=60
